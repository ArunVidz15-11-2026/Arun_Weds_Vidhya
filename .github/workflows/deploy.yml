name: Deploy to GitHub Pages

on:
  push:
    branches: [main, publish/arunvel-vidhya]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build main invitation
        run: npm ci && npm run build

      - name: Build main bride variant
        working-directory: bride
        run: npm ci && npm run build

      - name: Build no-Haldi invitation
        working-directory: no-haldi
        run: npm ci && npm run build

      - name: Build no-Haldi bride variant
        working-directory: no-haldi/bride
        run: npm ci && npm run build

      - name: Assemble Pages output
        run: |
          mkdir -p pages/bride pages/no-haldi/bride
          cp -r dist/. pages/
          cp -r bride/dist/. pages/bride/
          cp -r no-haldi/dist/. pages/no-haldi/
          cp -r no-haldi/bride/dist/. pages/no-haldi/bride/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
